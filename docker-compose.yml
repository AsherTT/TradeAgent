services:
  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://tradeagent:tradeagent-local-only@postgres:5432/tradeagent
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://tradeagent:tradeagent-local-only@postgres:5432/tradeagent
      REDIS_BROKER_URL: redis://redis:6379/0
      REDIS_RESULT_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A backend.app.jobs.celery_app:celery_app worker --loglevel=INFO
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://tradeagent:tradeagent-local-only@postgres:5432/tradeagent
      REDIS_BROKER_URL: redis://redis:6379/0
      REDIS_RESULT_URL: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A backend.app.jobs.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://tradeagent:tradeagent-local-only@postgres:5432/tradeagent
      REDIS_BROKER_URL: redis://redis:6379/0
      REDIS_RESULT_URL: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: tradeagent
      POSTGRES_USER: tradeagent
      POSTGRES_PASSWORD: tradeagent-local-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeagent -d tradeagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
