name: 项目检查

on:
  push:
    branches: [main, feature/dev-EasyTradeAgent]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy backend/app
      - run: python -m pytest -m "not live_model"
