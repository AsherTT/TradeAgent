name: 项目检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy backend/app
      - run: python -m pytest -m "not live_model"

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: 首页双语渲染检查
        shell: bash
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          PORT=3118 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/tradeagent-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3118/ > /dev/null; then
              PRODUCT_PREVIEW_URL=http://127.0.0.1:3118 node --test scripts/product-entry.test.mjs
              exit $?
            fi
            sleep 1
          done
          cat /tmp/tradeagent-preview.log
          exit 1
